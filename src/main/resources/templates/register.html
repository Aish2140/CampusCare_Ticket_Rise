<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Student Registration')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <span class="brand-badge mb-2"><i class="fa-solid fa-graduation-cap"></i></span>
                    <h3 class="fw-bold">Student Registration</h3>
                    <p class="text-muted small">Create your student support portal account</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small border-0 d-flex align-items-center gap-2 mb-3">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Full Name</label>
                        <input type="text" name="fullName" class="form-control" placeholder="e.g. Samantha Miller" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Student ID Number</label>
                        <input type="text" name="studentId" class="form-control" placeholder="e.g. STU-2024-112" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Institutional Email</label>
                        <input type="email" name="email" class="form-control" placeholder="student@campuscare.edu" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a secure password" required minlength="6">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary-custom py-2">
                            <i class="fa-solid fa-user-plus me-1"></i> Register Student Account
                        </button>
                    </div>

                    <div class="text-center small text-muted">
                        Already have an account? 
                        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
