<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('403 - Access Denied')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
<div class="text-center p-4">
    <div class="display-1 fw-bold text-danger mb-2"><i class="fa-solid fa-ban"></i></div>
    <h3 class="fw-bold text-dark mb-2">Access Denied</h3>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have administrative or departmental permission to access this resource.'}"></p>
    <a th:href="@{/dashboard}" class="btn btn-primary-custom px-4">
        <i class="fa-solid fa-arrow-left me-2"></i> Return to Safe Dashboard
    </a>
</div>
</body>
</html>
