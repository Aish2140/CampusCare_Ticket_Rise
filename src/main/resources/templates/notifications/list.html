<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h4 class="fw-bold mb-0 text-dark">Notification Center</h4>
                        <small class="text-muted">In-app notifications for ticket assignment, updates, and SLA alerts</small>
                    </div>
                    <form th:action="@{/notifications/mark-all-read}" method="post">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
                        </button>
                    </form>
                </div>

                <div class="notifications-list">
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                        <i class="fa-regular fa-bell-slash fa-3x mb-2 text-secondary d-block"></i>
                        You have no notifications at this time.
                    </div>

                    <div th:each="n : ${notifications}" 
                         class="p-3 mb-2 rounded-3 border d-flex justify-content-between align-items-center"
                         th:classappend="${n.isRead()} ? 'bg-white' : 'bg-primary-subtle bg-opacity-10 border-primary-subtle'">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="badge bg-light text-primary border small" th:text="${n.type}">TYPE</span>
                                <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Time</small>
                                <span th:if="${!n.isRead()}" class="badge bg-danger rounded-pill" style="font-size: 0.55rem;">NEW</span>
                            </div>
                            <div class="fw-semibold text-dark small" th:text="${n.message}">Notification message</div>
                        </div>
                        <div class="ms-3 d-flex gap-2">
                            <a th:if="${n.ticket != null}" th:href="@{'/tickets/' + ${n.ticket.id}}" class="btn btn-outline-primary btn-sm">
                                View Ticket
                            </a>
                            <a th:if="${!n.isRead()}" th:href="@{'/notifications/' + ${n.id} + '/read'}" class="btn btn-light btn-sm" title="Mark as read">
                                <i class="fa-solid fa-check"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
