<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('User Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold fs-2 mb-2" style="width: 72px; height: 72px;">
                        <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                    </div>
                    <h4 class="fw-bold mb-0 text-dark" th:text="${user.fullName}">Full Name</h4>
                    <span class="badge bg-primary-subtle text-primary mt-1" th:text="${user.role.displayName}">Role</span>
                </div>

                <div class="mb-4 p-3 bg-light rounded-3">
                    <div class="row g-2 small">
                        <div class="col-sm-5 text-muted">Email:</div>
                        <div class="col-sm-7 fw-semibold text-dark" th:text="${user.email}">user@email.com</div>

                        <div class="col-sm-5 text-muted">Identifier:</div>
                        <div class="col-sm-7 fw-semibold text-dark" th:text="${user.studentOrEmployeeId != null ? user.studentOrEmployeeId : 'N/A'}">ID</div>

                        <div class="col-sm-5 text-muted">Department:</div>
                        <div class="col-sm-7 fw-semibold text-dark" th:text="${user.department != null ? user.department.name : 'N/A'}">Dept</div>

                        <div class="col-sm-5 text-muted">Account Status:</div>
                        <div class="col-sm-7">
                            <span th:if="${user.isActive()}" class="badge bg-success">Active</span>
                            <span th:if="${!user.isActive()}" class="badge bg-danger">Deactivated</span>
                        </div>

                        <div class="col-sm-5 text-muted">Joined:</div>
                        <div class="col-sm-7 fw-semibold text-dark" th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</div>
                    </div>
                </div>

                <form th:action="@{/profile/update}" method="post">
                    <h6 class="fw-bold text-dark mb-3">Update Details</h6>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Full Name</label>
                        <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-custom">Save Profile Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
