<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Staff Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
        <div>
            <h2 class="fw-bold mb-1 text-dark">Staff Directory &amp; Workload Administration</h2>
            <p class="text-muted mb-0 small">Manage support staff accounts, departmental affiliations, and account activation.</p>
        </div>
        <div>
            <button type="button" class="btn btn-primary-custom btn-sm" data-bs-toggle="modal" data-bs-target="#newStaffModal">
                <i class="fa-solid fa-user-plus me-1"></i> Add Support Staff
            </button>
        </div>
    </div>

    <!-- Staff Directory Table -->
    <div class="card card-custom">
        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Email &amp; ID</th>
                        <th>Department</th>
                        <th>Account Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${staffList}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px;">
                                    <span th:text="${#strings.substring(s.fullName, 0, 1)}">S</span>
                                </div>
                                <div>
                                    <div class="fw-bold text-dark" th:text="${s.fullName}">Name</div>
                                    <small class="badge bg-light text-secondary border">Support Staff</small>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="small fw-semibold text-dark" th:text="${s.email}">email</div>
                            <small class="text-muted" th:text="${s.studentOrEmployeeId}">ID</small>
                        </td>
                        <td>
                            <form th:action="@{'/admin/staff/' + ${s.id} + '/department'}" method="post" class="d-flex gap-1 align-items-center">
                                <select name="departmentId" class="form-select form-select-sm" style="max-width: 220px;" onchange="this.form.submit()">
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"
                                            th:selected="${s.department != null && s.department.id == d.id}"></option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <span th:if="${s.isActive()}" class="badge bg-success-subtle text-success">
                                <i class="fa-solid fa-circle-check me-1"></i> Active
                            </span>
                            <span th:if="${!s.isActive()}" class="badge bg-danger-subtle text-danger">
                                <i class="fa-solid fa-circle-xmark me-1"></i> Deactivated
                            </span>
                        </td>
                        <td>
                            <form th:action="@{'/admin/staff/' + ${s.id} + '/toggle-status'}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-secondary btn-sm" th:title="${s.isActive()} ? 'Deactivate Account' : 'Activate Account'">
                                    <i class="fa-solid fa-power-off" th:classappend="${s.isActive()} ? 'text-danger' : 'text-success'"></i>
                                    <span th:text="${s.isActive()} ? 'Deactivate' : 'Activate'">Toggle</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Add New Staff Member -->
<div class="modal fade" id="newStaffModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/staff/create}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Add Support Staff</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="fullName" class="form-control" required placeholder="e.g. Maya Sen">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Institutional Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required placeholder="maya.sen@campuscare.edu">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Employee Identifier <span class="text-danger">*</span></label>
                        <input type="text" name="employeeId" class="form-control" required placeholder="EMP-XXX-105">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Department Assignment <span class="text-danger">*</span></label>
                        <select name="departmentId" class="form-select" required>
                            <option value="">-- Choose Department --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Initial Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required minlength="6" placeholder="••••••••">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom btn-sm px-4">Create Staff Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
